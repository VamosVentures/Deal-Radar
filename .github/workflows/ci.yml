name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid string of pushes to a
# PR doesn't queue up redundant full suites.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, lint, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Build frontend and verify server build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # e2e/env.ts pins the E2E backend/frontend to dedicated ports, a
      # temp-directory SQLite file, and test-only ADMIN_PASSWORD/SESSION_SECRET
      # values — nothing here needs a real secret, and nothing here can touch
      # a developer's local database.
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
